<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Wave Simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="controls">
        <button id="controlsClose" class="controls-close" aria-label="Close settings">×</button>
        <h3>Wave Simulator</h3>
        <div class="control-group">
            <label>Water Depth:</label>
            <input type="range" id="waterDepth" min="0.5" max="5.0" step="0.5" value="1.0">
            <span class="value" id="depthVal">1.0</span>
        </div>
        <!-- Camera height removed — use Space/Ctrl to move camera up/down -->
        <div class="control-group">
            <label>Sun Rotation Speed:</label>
            <input type="range" id="sunRotationSpeed" min="0.0" max="10.0" step="0.25" value="0.5">
            <span class="value" id="sunSpeedVal">0.5</span>
        </div>
        <div class="control-group">
            <label>Boat Rotation Speed:</label>
            <input type="range" id="boatRotationSpeed" min="0.0" max="10.0" step="0.25" value="5.0">
            <span class="value" id="boatSpeedVal">5.0</span>
        </div>
        <div class="control-group">
            <label>Star Density:</label>
            <input type="range" id="starDensity" min="0.0" max="0.10" step="0.005" value="0.01">
            <span class="value" id="starDensityVal">0.01</span>
        </div>

        <div class="control-group">
            <label>Resolution Scale:</label>
            <!-- multiplier style: 0.25..1.0 (25%..100%) -->
            <input type="range" id="resolutionScale" min="0.25" max="1.0" step="0.05" value="1.0">
            <span class="value" id="resolutionVal">100%</span>
        </div>
    </div>

    <!-- small button that appears after the controls are closed so user can re-open them -->
    <button id="controlsOpen" class="controls-open" aria-label="Open settings" hidden>⚙️</button>

    <!-- Paused overlay indicator -->
    <div id="pauseOverlay" class="pause-overlay" hidden>PAUSED — press P to resume</div>

    <!-- HUD / Controls hint -->
    <div id="hudLegend" class="hud-legend" aria-hidden="false">
        <div class="hud-row"><strong>W/A/S/D</strong> — move</div>
        <div class="hud-row"><strong>Space</strong> — up, <strong>Ctrl</strong> — down</div>
        <div class="hud-row"><strong>P</strong> — pause / resume</div>
        <div class="hud-row"><strong>Right-click + drag</strong> — look around</div>
    </div>

    <script src="main.js"></script>
</body>
</html>
